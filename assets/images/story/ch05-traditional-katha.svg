<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="kathaBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E0A08"/>
      <stop offset="50%" stop-color="#1E140E"/>
      <stop offset="100%" stop-color="#0B0907"/>
    </linearGradient>
    <radialGradient id="diyaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE28A" stop-opacity="0.6"/>
      <stop offset="35%" stop-color="#E5C46A" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#C99A3D" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0E0A08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8EC"/>
      <stop offset="50%" stop-color="#EFE2C8"/>
      <stop offset="100%" stop-color="#D9C7A7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#kathaBg)"/>
  <circle cx="600" cy="380" r="350" fill="url(#diyaGlow)"/>

  <!-- Altar Wooden Platform -->
  <rect x="200" y="520" width="800" height="40" rx="4" fill="#2E1D13" stroke="#C99A3D" stroke-width="1.5"/>

  <!-- Ancient Printed Manuscript / Katha Pothi (1900 Publication Aesthetic) -->
  <g transform="translate(600, 420)">
    <!-- Open Pothi Leaves -->
    <path d="M -280,-40 C -150,-60 -20,-20 0,0 C 20,-20 150,-60 280,-40 L 290,60 C 150,40 20,80 0,100 C -20,80 -150,40 -290,60 Z" fill="url(#paperGrad)" stroke="#8C6721" stroke-width="2" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.8))"/>
    
    <!-- Text Lines on Pothi Leaves -->
    <g stroke="#594429" stroke-width="1.5" opacity="0.65" stroke-linecap="round">
      <line x1="-240" y1="-20" x2="-30" y2="0"/>
      <line x1="-240" y1="5" x2="-30" y2="25"/>
      <line x1="-240" y1="30" x2="-50" y2="50"/>

      <line x1="30" y1="0" x2="240" y2="-20"/>
      <line x1="30" y1="25" x2="240" y2="5"/>
      <line x1="50" y1="50" x2="240" y2="30"/>
    </g>

    <!-- Sacred Red Vermilion Swastika & Om on Manuscript Center -->
    <text x="0" y="25" font-family="'Noto Serif Devanagari', serif" font-size="28" font-weight="bold" fill="#B3241C" text-anchor="middle">
      卐 ॐ 卐
    </text>
    <text x="0" y="65" font-family="'Noto Serif Devanagari', serif" font-size="16" fill="#422E1A" text-anchor="middle">
      श्री विश्वकर्मदेव की कथा (१९००)
    </text>
  </g>

  <!-- Brass Diya with Divine Flame -->
  <g transform="translate(600, 240)">
    <!-- Diya Base & Bowl -->
    <ellipse cx="0" cy="40" rx="45" ry="16" fill="#C99A3D" stroke="#E5C46A" stroke-width="1.5"/>
    <path d="M -45,40 Q 0,65 45,40 Z" fill="#8C6721"/>

    <!-- Flame Aura & Core -->
    <ellipse cx="0" cy="5" rx="35" ry="50" fill="#FFA500" opacity="0.25" filter="blur(10px)"/>
    <path d="M 0,-25 C -15,5 -12,25 0,35 C 12,25 15,5 0,-25 Z" fill="#FFCC00"/>
    <path d="M 0,-15 C -8,5 -6,20 0,28 C 6,20 8,5 0,-15 Z" fill="#FFFFFF"/>
  </g>

  <!-- Scattered Orange & Yellow Marigold Petals -->
  <g fill="#FF8800" opacity="0.8">
    <ellipse cx="320" cy="530" rx="8" ry="5" transform="rotate(20 320 530)"/>
    <ellipse cx="340" cy="535" rx="7" ry="6" transform="rotate(-15 340 535)"/>
    <ellipse cx="420" cy="528" rx="8" ry="5" transform="rotate(45 420 528)"/>
    <ellipse cx="780" cy="532" rx="9" ry="5" transform="rotate(-30 780 532)"/>
    <ellipse cx="820" cy="528" rx="7" ry="5" transform="rotate(10 820 528)"/>
    <ellipse cx="860" cy="535" rx="8" ry="6" transform="rotate(60 860 535)"/>
  </g>

  <text x="600" y="660" font-family="'Cinzel', serif" font-size="16" letter-spacing="6" fill="#C99A3D" text-anchor="middle">
    HISTORICAL VRAT KATHA · 1900 TRADITION
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEFA8"/>
      <stop offset="50%" stop-color="#C99A3D"/>
      <stop offset="100%" stop-color="#805C15"/>
    </linearGradient>
    <pattern id="circuitGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#C99A3D" stroke-width="0.5" opacity="0.25"/>
    </pattern>
    <filter id="digitalGlow">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="300" fill="#090B0E"/>
  <rect width="400" height="300" fill="url(#circuitGrid)"/>

  <!-- Circuit Trace Schematics -->
  <g stroke="#C99A3D" stroke-width="1" fill="none" opacity="0.45">
    <path d="M 40,60 H 120 L 150,90 H 220"/>
    <circle cx="40" cy="60" r="3" fill="#C99A3D"/>
    <circle cx="220" cy="90" r="3" fill="#C99A3D"/>
    <path d="M 360,220 H 280 L 250,190 H 180"/>
    <circle cx="360" cy="220" r="3" fill="#C99A3D"/>
    <circle cx="180" cy="190" r="3" fill="#C99A3D"/>
  </g>

  <!-- Digital Slate / Vector Architecture Canvas -->
  <g transform="translate(200, 140)" filter="url(#digitalGlow)">
    <!-- Tablet / Display Screen -->
    <rect x="-110" y="-70" width="220" height="140" rx="8" fill="#12161A" stroke="url(#neonGold)" stroke-width="2"/>
    <rect x="-100" y="-60" width="200" height="120" rx="4" fill="#0A0D10"/>
    
    <!-- Code Syntax & 3D Vector Wireframe inside screen -->
    <path d="M -85,-40 L -70,-40 M -85,-25 L -50,-25 M -85,-10 L -60,-10" stroke="#E5B869" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <text x="-85" y="15" fill="#FFEAA7" font-family="monospace" font-size="11" opacity="0.85">&lt;create /&gt;</text>

    <!-- 3D Isometric Wireframe Cube (Digital Vastu Structure) -->
    <g transform="translate(35, -5)" stroke="#C99A3D" stroke-width="1.5" fill="none" opacity="0.9">
      <polygon points="0,-25 30,-10 0,5 -30,-10" stroke="#FFEAA7"/>
      <polygon points="-30,-10 0,5 0,35 -30,20"/>
      <polygon points="30,-10 0,5 0,35 30,20"/>
    </g>

    <!-- Digital Stylus Pen hovering above tablet -->
    <g transform="translate(50, 40) rotate(-35)">
      <polygon points="0,0 6,10 6,80 -6,80 -6,10" fill="url(#neonGold)" stroke="#2D2109" stroke-width="1.5"/>
      <polygon points="0,-12 6,0 -6,0" fill="#FFF7C2"/>
      <circle cx="0" cy="-14" r="3" fill="#FFEAA7"/>
      <!-- Tilak marking on modern stylus -->
      <circle cx="0" cy="40" r="2.5" fill="#B31D1D"/>
    </g>
  </g>

  <text x="30" y="270" fill="#C99A3D" font-family="'Cinzel', serif" font-size="11" letter-spacing="2">DIGITAL ARCHITECTURE · CODE &amp; SILICON</text>
  <text x="370" y="270" text-anchor="end" fill="#E5B869" font-family="'Noto Serif Devanagari', serif" font-size="12">डिजिटल सृजन · नवयुग कर्म</text>
</svg>
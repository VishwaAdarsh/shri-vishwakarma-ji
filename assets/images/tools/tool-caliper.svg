<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7C2"/>
      <stop offset="45%" stop-color="#C99A3D"/>
      <stop offset="85%" stop-color="#785513"/>
      <stop offset="100%" stop-color="#3A2807"/>
    </linearGradient>
    <pattern id="caliperGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#C99A3D" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    <filter id="caliperGlow">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="300" fill="#0E0C09"/>
  <rect width="400" height="300" fill="url(#caliperGrid)"/>

  <!-- Vastu Golden Ratio Circles & Angle Arcs -->
  <g stroke="#C99A3D" stroke-width="0.75" opacity="0.4">
    <circle cx="200" cy="70" r="140" fill="none" stroke-dasharray="4,4"/>
    <circle cx="200" cy="70" r="90" fill="none" stroke-dasharray="2,6"/>
    <!-- Measurement Arc with Degree Ticks -->
    <path d="M 120,195 A 130 130 0 0 0 280,195" fill="none" stroke="#E5B869" stroke-width="1.5"/>
    <line x1="140" y1="180" x2="145" y2="173" stroke="#C99A3D" stroke-width="1.5"/>
    <line x1="170" y1="195" x2="172" y2="187" stroke="#C99A3D" stroke-width="1.5"/>
    <line x1="200" y1="200" x2="200" y2="190" stroke="#C99A3D" stroke-width="1.5"/>
    <line x1="230" y1="195" x2="228" y2="187" stroke="#C99A3D" stroke-width="1.5"/>
    <line x1="260" y1="180" x2="255" y2="173" stroke="#C99A3D" stroke-width="1.5"/>
  </g>

  <!-- Brass Caliper / Divider -->
  <g transform="translate(200, 70)" filter="url(#caliperGlow)">
    <!-- Central Hinge Pivot -->
    <circle cx="0" cy="0" r="16" fill="url(#brassGrad)" stroke="#38260B" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="#FFEAA7" stroke="#785513" stroke-width="1.5"/>
    <!-- Left Leg -->
    <path d="M -8,12 L -65,150 L -60,154 L 0,16 Z" fill="url(#brassGrad)" stroke="#38260B" stroke-width="1.5"/>
    <polygon points="-65,150 -70,162 -60,154" fill="#FFF7C2" stroke="#C99A3D"/>
    <!-- Right Leg -->
    <path d="M 8,12 L 65,150 L 60,154 L 0,16 Z" fill="url(#brassGrad)" stroke="#38260B" stroke-width="1.5"/>
    <polygon points="65,150 70,162 60,154" fill="#FFF7C2" stroke="#C99A3D"/>
    <!-- Fine Adjustment Wing Arc & Screw -->
    <path d="M -35,90 Q 0,110 35,90" fill="none" stroke="#C99A3D" stroke-width="3"/>
    <rect x="25" y="83" width="14" height="14" rx="2" fill="#FFEAA7" stroke="#523A12" stroke-width="1.5"/>
    <!-- Tilak -->
    <circle cx="0" cy="0" r="3" fill="#B31D1D"/>
  </g>

  <text x="30" y="270" fill="#C99A3D" font-family="'Cinzel', serif" font-size="11" letter-spacing="2">MEASUREMENT &amp; VASTU · SACRED PROPORTION</text>
  <text x="370" y="270" text-anchor="end" fill="#E5B869" font-family="'Noto Serif Devanagari', serif" font-size="12">मान-यन्त्र · प्रमाण विधान</text>
</svg>
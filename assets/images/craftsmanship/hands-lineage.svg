<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C99A3D" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#E5B869" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C99A3D" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="handGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="60%" stop-color="#C99A3D"/>
      <stop offset="100%" stop-color="#6E4D13"/>
    </linearGradient>
    <filter id="lineageGlow">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="360" fill="#0B0907"/>
  
  <!-- Continuous Golden Thread of Transmission -->
  <line x1="50" y1="180" x2="750" y2="180" stroke="url(#goldBeam)" stroke-width="2"/>
  <circle cx="130" cy="180" r="40" fill="none" stroke="#C99A3D" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <circle cx="310" cy="180" r="40" fill="none" stroke="#C99A3D" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <circle cx="490" cy="180" r="40" fill="none" stroke="#C99A3D" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <circle cx="670" cy="180" r="40" fill="none" stroke="#C99A3D" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Stage 1: Ancient Stone Sculptor's Hand -->
  <g transform="translate(130, 160)" filter="url(#lineageGlow)">
    <!-- Stylized Hands holding Chisel & Mallet -->
    <path d="M -30,10 Q -10,-10 0,5 Q 10,20 -15,35 Z" fill="#241B0E" stroke="url(#handGold)" stroke-width="1.5"/>
    <rect x="-5" y="-20" width="10" height="30" rx="2" fill="url(#handGold)"/>
    <text x="0" y="70" text-anchor="middle" fill="#E5B869" font-family="'Cinzel', serif" font-size="12" letter-spacing="1">ANCIENT SCULPTOR</text>
    <text x="0" y="90" text-anchor="middle" fill="#C99A3D" font-family="'Noto Serif Devanagari', serif" font-size="12">शिल्पी के हाथ</text>
  </g>

  <!-- Transmission Arrow 1 -->
  <path d="M 200,180 L 235,180 M 230,175 L 235,180 L 230,185" stroke="#C99A3D" stroke-width="1.5"/>

  <!-- Stage 2: Classical Blacksmith / Carpenter's Hand -->
  <g transform="translate(310, 160)" filter="url(#lineageGlow)">
    <path d="M -25,5 Q 0,-15 15,0 Q 25,15 -5,30 Z" fill="#241B0E" stroke="url(#handGold)" stroke-width="1.5"/>
    <line x1="-15" y1="-15" x2="20" y2="20" stroke="url(#handGold)" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="70" text-anchor="middle" fill="#E5B869" font-family="'Cinzel', serif" font-size="12" letter-spacing="1">MASTER CRAFTSMAN</text>
    <text x="0" y="90" text-anchor="middle" fill="#C99A3D" font-family="'Noto Serif Devanagari', serif" font-size="12">कारीगर का हुनर</text>
  </g>

  <!-- Transmission Arrow 2 -->
  <path d="M 380,180 L 415,180 M 410,175 L 415,180 L 410,185" stroke="#C99A3D" stroke-width="1.5"/>

  <!-- Stage 3: Industrial Engineer & Architect's Hand -->
  <g transform="translate(490, 160)" filter="url(#lineageGlow)">
    <path d="M -20,8 Q 0,-12 15,5 Q 15,22 -10,28 Z" fill="#241B0E" stroke="url(#handGold)" stroke-width="1.5"/>
    <path d="M -8,-15 L 8,-15 L 0,25 Z" fill="none" stroke="url(#handGold)" stroke-width="2"/>
    <text x="0" y="70" text-anchor="middle" fill="#E5B869" font-family="'Cinzel', serif" font-size="12" letter-spacing="1">ARCHITECT &amp; ENGINEER</text>
    <text x="0" y="90" text-anchor="middle" fill="#C99A3D" font-family="'Noto Serif Devanagari', serif" font-size="12">वास्तुकार व अभियंता</text>
  </g>

  <!-- Transmission Arrow 3 -->
  <path d="M 560,180 L 595,180 M 590,175 L 595,180 L 590,185" stroke="#C99A3D" stroke-width="1.5"/>

  <!-- Stage 4: Modern Digital Creator & Maker's Hand -->
  <g transform="translate(670, 160)" filter="url(#lineageGlow)">
    <path d="M -22,10 Q -5,-10 12,3 Q 20,18 -8,32 Z" fill="#241B0E" stroke="url(#handGold)" stroke-width="1.5"/>
    <line x1="8" y1="-18" x2="-6" y2="18" stroke="#FFEAA7" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="10" cy="-20" r="3" fill="#FFEAA7"/>
    <text x="0" y="70" text-anchor="middle" fill="#E5B869" font-family="'Cinzel', serif" font-size="12" letter-spacing="1">DIGITAL MAKER</text>
    <text x="0" y="90" text-anchor="middle" fill="#C99A3D" font-family="'Noto Serif Devanagari', serif" font-size="12">आधुनिक रचनाकार</text>
  </g>

  <!-- Unified Philosophy Headline -->
  <text x="400" y="55" text-anchor="middle" fill="#E5B869" font-family="'Cinzel', serif" font-size="14" letter-spacing="4">THE SACRED TRANSMISSION OF HUMAN SKILL</text>
  <text x="400" y="325" text-anchor="middle" fill="#C99A3D" font-family="'Noto Serif Devanagari', serif" font-size="13">"हाथ बदलते हैं, औज़ार बदलते हैं — सृजन की पवित्र आत्मा वही रहती है।"</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3A1810" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#18120C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#080604" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4BD"/>
      <stop offset="40%" stop-color="#E5B869"/>
      <stop offset="75%" stop-color="#C99A3D"/>
      <stop offset="100%" stop-color="#8E6A21"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  
  <!-- Outer Sacred Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="#C99A3D" stroke-width="2" opacity="0.4"/>
  <rect x="45" y="45" width="1110" height="540" rx="12" fill="none" stroke="#E5B869" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>

  <!-- Sacred Vastu Mandala Background Geometry -->
  <g transform="translate(600, 315)" opacity="0.2" stroke="#C99A3D" stroke-width="1.5" fill="none">
    <circle r="220" stroke-dasharray="4,6"/>
    <circle r="170"/>
    <polygon points="0,-200 141,-141 200,0 141,141 0,200 -141,141 -200,0 -141,-141"/>
    <line x1="-240" y1="0" x2="240" y2="0"/>
    <line x1="0" y1="-240" x2="0" y2="240"/>
  </g>

  <!-- Central Title & Typography -->
  <text x="600" y="190" text-anchor="middle" fill="url(#goldGrad)" font-family="'Noto Serif Devanagari', serif" font-size="56" font-weight="bold" letter-spacing="4">
    ॐ विश्वकर्मणे नमः
  </text>
  
  <text x="600" y="270" text-anchor="middle" fill="#FFF9E6" font-family="'Cinzel', serif" font-size="64" font-weight="bold" letter-spacing="12">
    VISHWAKARMA
  </text>
  
  <text x="600" y="330" text-anchor="middle" fill="#E5B869" font-family="'Cinzel', serif" font-size="24" letter-spacing="16">
    THE DIVINE ARCHITECT
  </text>

  <!-- Golden Divider -->
  <line x1="450" y1="375" x2="750" y2="375" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="600" cy="375" r="5" fill="#FFEAA7"/>

  <text x="600" y="440" text-anchor="middle" fill="#D1C7B7" font-family="'Inter', sans-serif" font-size="20" letter-spacing="2">
    A Cinematic Digital Journey Through Creation, Craftsmanship &amp; Devotion
  </text>

  <text x="600" y="490" text-anchor="middle" fill="#C99A3D" font-family="'Noto Serif Devanagari', serif" font-size="22">
    सृष्टि · शिल्प · दिव्य स्थापत्य · पूजन · कर्म साधना
  </text>

  <text x="600" y="555" text-anchor="middle" fill="#8E7D6A" font-family="'Cinzel', serif" font-size="14" letter-spacing="4">
    RIGVEDA 10.81 · PURANIC HERITAGE · 1900 HISTORICAL KATHA
  </text>
</svg>
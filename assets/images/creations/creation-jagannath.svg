<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sanctumDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080605"/>
      <stop offset="50%" stop-color="#1A120D"/>
      <stop offset="100%" stop-color="#0B0907"/>
    </linearGradient>
    <radialGradient id="lampLight" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#FFD470" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#C99A3D" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#080605" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="woodLog" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#543820"/>
      <stop offset="50%" stop-color="#734F2F"/>
      <stop offset="100%" stop-color="#3A2412"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sanctumDark)"/>
  <circle cx="400" cy="300" r="260" fill="url(#lampLight)"/>

  <!-- Temple Door Arch (Sanctuary with Closed Doors) -->
  <path d="M 180,520 L 180,240 Q 400,100 620,240 L 620,520 Z" fill="none" stroke="#C99A3D" stroke-width="3" opacity="0.4"/>
  <path d="M 210,520 L 210,255 Q 400,130 590,255 L 590,520 Z" fill="none" stroke="#E5C46A" stroke-width="1" stroke-dasharray="8,6" opacity="0.3"/>

  <!-- Sacred Daru-Brahma Timber Logs & Deity Silhouettes -->
  <!-- Balabhadra (Left) -->
  <g transform="translate(270, 320)">
    <rect x="-45" y="-100" width="90" height="180" rx="20" fill="#F4EDE0" stroke="#C99A3D" stroke-width="2"/>
    <!-- Large Round Eyes -->
    <circle cx="-20" cy="-40" r="14" fill="#0B0907" stroke="#C99A3D" stroke-width="2"/>
    <circle cx="20" cy="-40" r="14" fill="#0B0907" stroke="#C99A3D" stroke-width="2"/>
    <circle cx="-20" cy="-40" r="6" fill="#F4EDE0"/>
    <circle cx="20" cy="-40" r="6" fill="#F4EDE0"/>
    <!-- Tilak -->
    <path d="M 0,-70 L 0,-25" stroke="#3A1111" stroke-width="4"/>
  </g>

  <!-- Subhadra (Center) -->
  <g transform="translate(400, 340)">
    <rect x="-35" y="-85" width="70" height="150" rx="16" fill="#FFC83B" stroke="#C99A3D" stroke-width="2"/>
    <!-- Oval Eyes -->
    <ellipse cx="-15" cy="-35" rx="10" ry="14" fill="#0B0907" stroke="#C99A3D" stroke-width="1.5"/>
    <ellipse cx="15" cy="-35" rx="10" ry="14" fill="#0B0907" stroke="#C99A3D" stroke-width="1.5"/>
    <circle cx="-15" cy="-35" r="4" fill="#FFC83B"/>
    <circle cx="15" cy="-35" r="4" fill="#FFC83B"/>
  </g>

  <!-- Jagannath (Right) -->
  <g transform="translate(530, 320)">
    <rect x="-50" y="-100" width="100" height="180" rx="20" fill="#15100C" stroke="#C99A3D" stroke-width="2"/>
    <!-- Iconic Large Circular Eyes -->
    <circle cx="-22" cy="-40" r="18" fill="#F4EDE0" stroke="#C99A3D" stroke-width="2"/>
    <circle cx="22" cy="-40" r="18" fill="#F4EDE0" stroke="#C99A3D" stroke-width="2"/>
    <circle cx="-22" cy="-40" r="10" fill="#3A1111"/>
    <circle cx="22" cy="-40" r="10" fill="#3A1111"/>
    <circle cx="-22" cy="-40" r="4" fill="#F4EDE0"/>
    <circle cx="22" cy="-40" r="4" fill="#F4EDE0"/>
    <!-- Sacred Red Smile -->
    <path d="M -26,10 Q 0,35 26,10" fill="none" stroke="#C92A2A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Mysterious Artisan's Golden Chisel and Mallet Resting in Light -->
  <g transform="translate(400, 485)">
    <rect x="-60" y="-8" width="120" height="16" rx="4" fill="#C99A3D"/>
    <rect x="-8" y="-30" width="16" height="60" rx="3" fill="#E5C46A"/>
    <circle cx="0" cy="0" r="6" fill="#F5EBD5"/>
  </g>

  <text x="400" y="565" font-family="'Cinzel', serif" font-size="14" letter-spacing="5" fill="#C99A3D" text-anchor="middle">
    PURI JAGANNATH · THE MYSTERIOUS ARTISAN
  </text>
</svg>

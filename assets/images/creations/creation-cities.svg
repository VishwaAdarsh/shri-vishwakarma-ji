<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="citySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E0B08"/>
      <stop offset="60%" stop-color="#211812"/>
      <stop offset="100%" stop-color="#0B0907"/>
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E24"/>
      <stop offset="100%" stop-color="#080D10"/>
    </linearGradient>
    <linearGradient id="citadelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA6"/>
      <stop offset="50%" stop-color="#C99A3D"/>
      <stop offset="100%" stop-color="#5E4010"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#citySky)"/>
  <rect y="420" width="800" height="180" fill="url(#seaGrad)"/>

  <!-- Celestial Moon/Sun radiance -->
  <circle cx="400" cy="180" r="140" fill="#E5C46A" opacity="0.15" filter="blur(30px)"/>

  <!-- Citadels Silhouette & Spires -->
  <g fill="url(#citadelGold)" stroke="#E5C46A" stroke-width="0.75">
    <!-- Center Grand Palace of Dwarka / Lanka -->
    <polygon points="400,90 415,160 385,160"/>
    <rect x="382" y="160" width="36" height="120"/>
    <polygon points="400,280 430,340 370,340"/>
    <rect x="365" y="340" width="70" height="80"/>

    <!-- Left Flanking Towers -->
    <polygon points="310,140 322,200 298,200"/>
    <rect x="300" y="200" width="20" height="160"/>
    <polygon points="230,170 242,230 218,230"/>
    <rect x="220" y="230" width="20" height="150"/>
    <polygon points="150,220 160,270 140,270"/>
    <rect x="142" y="270" width="16" height="120"/>

    <!-- Right Flanking Towers -->
    <polygon points="490,140 502,200 478,200"/>
    <rect x="480" y="200" width="20" height="160"/>
    <polygon points="570,170 582,230 558,230"/>
    <rect x="560" y="230" width="20" height="150"/>
    <polygon points="650,220 660,270 640,270"/>
    <rect x="642" y="270" width="16" height="120"/>

    <!-- Fortification Walls and Arches -->
    <rect x="120" y="380" width="560" height="40" fill="#241B14" stroke="#C99A3D"/>
  </g>

  <!-- Sea Reflection -->
  <g stroke="#C99A3D" opacity="0.3" stroke-linecap="round">
    <line x1="380" y1="435" x2="420" y2="435" stroke-width="2"/>
    <line x1="350" y1="450" x2="450" y2="450" stroke-width="2"/>
    <line x1="320" y1="470" x2="480" y2="470" stroke-width="1.5"/>
    <line x1="280" y1="495" x2="520" y2="495" stroke-width="1"/>
    <line x1="220" y1="525" x2="580" y2="525" stroke-width="0.75"/>
  </g>

  <text x="400" y="560" font-family="'Cinzel', serif" font-size="14" letter-spacing="5" fill="#C99A3D" text-anchor="middle">
    DWARKA &amp; LANKA · CELESTIAL CITIES
  </text>
</svg>

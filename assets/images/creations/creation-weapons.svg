<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF2A3" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#E5C46A" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#C99A3D" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0B0907" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DB"/>
      <stop offset="50%" stop-color="#C99A3D"/>
      <stop offset="100%" stop-color="#6E4D13"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3A1111"/>
      <stop offset="50%" stop-color="#8C2511"/>
      <stop offset="100%" stop-color="#E5C46A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#0B0907"/>
  <circle cx="400" cy="300" r="280" fill="url(#sunGlow)"/>

  <!-- Lathe Ring (Bhrami) -->
  <circle cx="400" cy="300" r="210" fill="none" stroke="#C99A3D" stroke-width="2" stroke-dasharray="12,8" opacity="0.6"/>
  <circle cx="400" cy="300" r="230" fill="none" stroke="#E5C46A" stroke-width="1" opacity="0.3"/>

  <!-- Sudarshana Chakra (Left Center) -->
  <g transform="translate(310, 300)">
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#metalGrad)" stroke-width="8"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#E5C46A" stroke-width="3" stroke-dasharray="4,4"/>
    <circle cx="0" cy="0" r="30" fill="url(#metalGrad)"/>
    <circle cx="0" cy="0" r="12" fill="#0B0907"/>

    <!-- 108 Serrated Flames/Blades -->
    <g stroke="url(#metalGrad)" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-110" x2="18" y2="-135"/>
      <line x1="0" y1="110" x2="-18" y2="135"/>
      <line x1="-110" y1="0" x2="-135" y2="-18"/>
      <line x1="110" y1="0" x2="135" y2="18"/>
      <line x1="-78" y1="-78" x2="-95" y2="-100"/>
      <line x1="78" y1="78" x2="95" y2="100"/>
      <line x1="-78" y1="78" x2="-100" y2="95"/>
      <line x1="78" y1="-78" x2="100" y2="-95"/>
    </g>
  </g>

  <!-- Shiva's Trishula (Right Center) -->
  <g transform="translate(510, 300) rotate(15)">
    <!-- Shaft -->
    <line x1="0" y1="-160" x2="0" y2="170" stroke="url(#metalGrad)" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Central Prong -->
    <path d="M 0,-160 Q 5,-230 0,-250 Q -5,-230 0,-160 Z" fill="url(#metalGrad)"/>
    
    <!-- Left Curved Prong -->
    <path d="M 0,-170 Q -50,-185 -55,-225 Q -40,-215 -15,-185 Z" fill="url(#metalGrad)"/>
    
    <!-- Right Curved Prong -->
    <path d="M 0,-170 Q 50,-185 55,-225 Q 40,-215 15,-185 Z" fill="url(#metalGrad)"/>
    
    <!-- Crossbar and Damaru Accent -->
    <rect x="-25" y="-170" width="50" height="8" rx="3" fill="#E5C46A"/>
    <circle cx="0" cy="-140" r="8" fill="#F5EBD5"/>
  </g>

  <!-- Lathe Sparks & Solar Splinters -->
  <g fill="#FFF5DB" opacity="0.8">
    <circle cx="390" cy="180" r="3"/>
    <circle cx="420" cy="160" r="2"/>
    <circle cx="370" cy="430" r="2.5"/>
    <circle cx="430" cy="420" r="3.5"/>
    <circle cx="480" cy="210" r="2"/>
    <circle cx="280" cy="380" r="2"/>
    <circle cx="560" cy="360" r="3"/>
  </g>

  <text x="400" y="540" font-family="'Cinzel', serif" font-size="14" letter-spacing="5" fill="#C99A3D" text-anchor="middle">
    SUDARSHANA CHAKRA &amp; TRISHULA · VISHNU PURANA
  </text>
</svg>
